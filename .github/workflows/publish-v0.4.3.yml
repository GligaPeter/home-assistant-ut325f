name: Publish v0.4.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable Bluetooth release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.3 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create v0.4.3 \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "UNI-T UT325F BLE v0.4.3" \
              --notes "Stability release: restores reliable live Bluetooth measurements and temporarily removes measurement-memory download to prevent connection loss. T1-T4 readings, settings, clock sync, and protected memory erase remain available."
