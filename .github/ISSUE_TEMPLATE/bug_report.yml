name: Bug report
description: Report a problem with the UT325F integration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please close all phone apps connected to the thermometer before testing.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: bluetooth
    attributes:
      label: Bluetooth connection
      options:
        - Local adapter
        - ESPHome Bluetooth proxy
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, addresses, and unrelated private information.
